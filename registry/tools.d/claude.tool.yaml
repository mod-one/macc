api_version: v1
id: claude
display_name: Claude
description: Project-level settings for Claude Code.
gitignore:
  - .claude/
  - CLAUDE.md
performer:
  preparation:
    authentication_errors: ["not logged in", "not logged into", "authentication required", "unauthorized"]
    network_errors: ["could not resolve host", "connection refused", "network is unreachable", "connection timed out", "tls handshake timeout"]
    verify: {command: claude, args: [auth, status, --json]}
    authentication_json: {"/loggedIn": false}
    expected_json: {"/loggedIn": true}
    setup: {command: claude, args: [auth, login]}
  scoped_mcp:
    path: .mcp.json
    format: json
    servers_key: mcpServers
  compaction:
    schema: native-auto-config-v1
    version_pattern: '(?i)^[0-9]+\.[0-9]+\.[0-9]+.*Claude Code'
    documentation: https://code.claude.com/docs/en/env-vars
    native_auto:
      format: env
      key: CLAUDE_AUTOCOMPACT_PCT_OVERRIDE
      unit: percent
      disabled_env: [DISABLE_AUTO_COMPACT]
  runner: adapters/claude/claude.performer.sh
  command: claude
  args: ["--model", "{model}", "--output-format", "text", "--dangerously-skip-permissions"]
  usage:
    schema: claude-stream-result-model-usage-v2
    required_for_checkpoint: true
    append_args: ["--verbose"]
    replace_values: {"--output-format": "stream-json"}
    event_match: {"/type": "result"}
    text_match: {"/type": "result"}
    text: ["/result"]
    text_arrays:
      - event_match: {"/type": "assistant"}
        path: /message/content
        item_match: {"/type": "text"}
        text: ["/text"]
    session_id: /session_id
    model_map: /modelUsage
    token_scope: session
    cost_scope: session
    cost_quality: estimated
    currency: USD
    fields:
      input_uncached: /inputTokens
      cached_read: /cacheReadInputTokens
      cached_write: /cacheCreationInputTokens
      output: /outputTokens
      cost: /total_cost_usd
  prompt:
    mode: arg
    arg: "-p"
  session:
    enabled: true
    scope: task_role_tool
    id_strategy: generated
    # `-r <uuid>` CONTINUES an existing conversation. `--session-id <uuid>`
    # OPENS one under that id and fails with "Session ID <uuid> is already in
    # use" on every later call, so it belongs under `create`, never under
    # `resume` or `retry`. Declaring it here makes ToolSpec::validate enforce
    # that, since MACC pools and re-issues session ids.
    create_only_flags: ["--session-id"]
    resume:
      command: claude
      args: ["--model", "{model}", "-r", "{session_id}", "--output-format", "text", "--dangerously-skip-permissions"]
    create:
      command: claude
      args: ["--model", "{model}", "--session-id", "{session_id}", "--output-format", "text", "--dangerously-skip-permissions"]
  # Retry args are merged into the resume invocation (attempt > 1), where the
  # session already exists, so this must be the resume flag too.
  retry:
    command: claude
    args: ["--model", "{model}", "-r", "{session_id}", "--output-format", "text", "--dangerously-skip-permissions"]
  # Claude CLI accepts --effort <low|medium|high|xhigh|max> to set reasoning depth.
  effort_flag: "--effort"
model_tiers:
  mini:
    model: opus
    effort: Low
  standard:
    model: sonnet
    effort: High
  heavy:
    model: opus
    effort: High
defaults:
  model: sonnet
install:
  confirm_message: "Claude Code install requires an Anthropic account/API key. Continue?"
  commands:
    - command: npm
      args: ["install", "-g", "@anthropic-ai/claude-code"]
  post_install:
    command: claude
    args: []
update:
  confirm_message: "Claude Code update may change behavior. Continue?"
  commands:
    - command: npm
      args: ["install", "-g", "@anthropic-ai/claude-code@latest"]
version_check:
  current:
    command: claude
    args: ["--version"]
  latest:
    command: npm
    args: ["view", "@anthropic-ai/claude-code", "version"]
fields:
  - id: model
    label: Model
    kind:
      type: enum
      options: ["fable", "opus", "sonnet", "sonnet[1m]", "haiku"]
    help: Claude model alias (e.g., sonnet, opus).
    pointer: /tools/config/claude/model
    default: "sonnet"
  - id: effortLevel
    label: effortLevel
    kind:
      type: enum
      options: ["Low", "Medium", "High", "Max"]
    help: Claude effort adjust (e.g., Low, Medium).
    pointer: /tools/config/claude/effortLevel
    default: "Medium"
  - id: language
    label: Language
    kind:
      type: enum
      options: ["English", "French", "Spanish", "German", "Japanese"]
    help: Primary language for prompts and output.
    pointer: /tools/config/claude/language
    default: "English"
  - id: permissions
    label: Permissions
    kind:
      type: enum
      options: ["safe", "dev", "strict"]
    help: Permissions preset for Claude settings.json.
    pointer: /tools/config/claude/permissions
    default: "safe"
  - id: rules_enabled
    label: Rules
    kind:
      type: bool
    help: Generate .claude/rules/*.md when enabled.
    pointer: /tools/config/claude/rules_enabled
  - id: skills
    label: Skills
    kind:
      type: action
      action: open_skills
      target_pointer: /tools/config/claude/skills
    help: Open Claude skills selector.
  - id: agents
    label: Agents
    kind:
      type: action
      action: open_agents
      target_pointer: /selections/agents
    help: Open Claude agents selector.
  - id: tier_mini_model
    label: Mini tier — model
    kind:
      type: enum
      options: ["fable", "opus", "sonnet", "sonnet[1m]", "haiku"]
    help: "Model used when routing tier = mini (light, fast tasks)."
    pointer: /tools/config/claude/model_tiers/mini/model
    default: "opus"
  - id: tier_mini_effort
    label: Mini tier — effort
    kind:
      type: enum
      options: ["Low", "Medium", "High", "Max"]
    help: "Effort level for the mini tier (not applicable to Haiku)."
    pointer: /tools/config/claude/model_tiers/mini/effort
    default: "Low"
  - id: tier_standard_model
    label: Standard tier — model
    kind:
      type: enum
      options: ["fable", "opus", "sonnet", "sonnet[1m]", "haiku"]
    help: "Model used when routing tier = standard (everyday tasks)."
    pointer: /tools/config/claude/model_tiers/standard/model
    default: "sonnet"
  - id: tier_standard_effort
    label: Standard tier — effort
    kind:
      type: enum
      options: ["Low", "Medium", "High", "Max"]
    help: "Effort level for the standard tier (not applicable to Haiku)."
    pointer: /tools/config/claude/model_tiers/standard/effort
    default: "High"
  - id: tier_heavy_model
    label: Heavy tier — model
    kind:
      type: enum
      options: ["fable", "opus", "sonnet", "sonnet[1m]", "haiku"]
    help: "Model used when routing tier = heavy (complex / architectural work)."
    pointer: /tools/config/claude/model_tiers/heavy/model
    default: "opus"
  - id: tier_heavy_effort
    label: Heavy tier — effort
    kind:
      type: enum
      options: ["Low", "Medium", "High", "Max"]
    help: "Effort level for the heavy tier (not applicable to Haiku)."
    pointer: /tools/config/claude/model_tiers/heavy/effort
    default: "High"
doctor:
  - kind: which
    value: claude
    severity: error
