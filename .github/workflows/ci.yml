name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_automation_tests:
        description: "Run automation integration tests (automat/tests/run.sh)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    name: Quality (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Web quality
        run: make web-ci

      - name: Tool-agnostic guardrail
        run: make check-generic

      - name: ToolSpec contract tests
        run: make test-contract

      - name: Automation integration tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_automation_tests == 'true' }}
        run: ./automat/tests/run.sh

  build-matrix:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build

      - name: Build CLI
        run: cargo build -p macc-cli --locked
