[package]
name = "macc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
inventory = "0.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
similar = { version = "2.4", features = ["text", "unicode"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
chrono = "0.4"
regex = "1.10"
syn = { version = "2", features = ["full"] }
quote = "1"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "time", "sync", "net", "io-util", "macros", "signal"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
