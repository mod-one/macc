[package]
name = "macc-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "macc"
path = "src/main.rs"

[dependencies]
macc-core = { path = "../core" }
macc-tui = { path = "../tui" }
macc-adapter-shared = { path = "../adapters/shared" }
macc-adapter-codex = { path = "../adapters/codex" }
macc-adapter-claude = { path = "../adapters/claude" }
macc-adapter-gemini = { path = "../adapters/gemini" }
macc-adapter-agy = { path = "../adapters/agy" }
macc-registry = { path = "../registry" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0.149"
chrono = "0.4"
tempfile = "3.8"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
mime_guess = "2.0"
rust-embed = "8.9"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
zip = "2.2"
tempfile = "3.8"
